<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say - Owner Voice Dashboard</title>
    <link rel="shortcut icon" href="#">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .say-container { width: 900px; height: 600px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; overflow: hidden; }
        
        /* Left Sidebar - Account List */
        .sidebar { width: 320px; border-right: 1px solid #eee; background: #fff; overflow-y: auto; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #eee; background: #fafafa; }
        .account-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .account-item:hover, .account-item.active { background: #f0f4ff; }
        .account-item img { width: 42px; height: 42px; border-radius: 50%; }
        .account-info h4 { font-size: 0.95rem; color: #333; }
        .account-info p { font-size: 0.75rem; color: #777; }

        /* Right Panel - Chat Workspace */
        .talk1 { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .tal1 { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8f9fa; }
        
        .tal2 { padding: 15px; border-top: 1px solid #eee; background: #fff; display: flex; flex-direction: column; gap: 10px; }
        .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .action-btns { display: flex; gap: 8px; }
        .ta1 { flex: 1; }
        .ta1 input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        button { background: #3b50fb; border: none; padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button svg { fill: #ffffff; }
        .mic { font-size: 0.8rem; color: #666; text-align: center; }

        /* WhatsApp-Style Bubble Base */
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            margin-bottom: 8px;
        }
        .message.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .message.received { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .message-text { word-wrap: break-word; color: #111b21; margin-bottom: 2px; }
        .time-stamp { font-size: 0.7rem; color: #667781; align-self: flex-end; }

        /* Voice Note Player Layout */
        .voice-note-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 280px;
            padding: 8px 6px;
        }

        .vn-top-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vn-play-btn {
            background: #00a884;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        
        .vn-play-btn.loading {
            background: #888888;
            cursor: wait;
        }

        .vn-play-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .vn-waveform {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vn-waveform svg {
            width: 100%;
            height: 26px;
            fill: #00a884;
            opacity: 0.75;
        }

        .vn-duration {
            font-size: 0.72rem;
            background: rgba(0, 0, 0, 0.06);
            padding: 3px 8px;
            border-radius: 12px;
            color: #54656f;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Seek Bar & Volume Controls */
        .vn-controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .vn-slider-container {
            flex: 1;
            display: flex;
            align-items: center;
        }

        /* Generic Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #ccc;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00a884;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .vn-progress-slider {
            width: 100%;
        }

        /* Volume Control Module */
        .vn-volume-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vn-volume-btn {
            background: transparent;
            border: none;
            padding: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vn-volume-btn svg {
            width: 16px;
            height: 16px;
            fill: #54656f;
        }

        .vn-volume-slider {
            width: 45px;
        }
    </style>
</head>
<body>

<div class="say-container">
    <div class="sidebar">
        <div class="sidebar-header">Voice Orders Chat</div>
        <div id="accountsList"></div>
    </div>

    <div class="talk1">
        <div class="tal1" id="chatArea">
            <p style="text-align: center; color: #888; margin-top: 50px;">Select an account from the left sidebar to start chatting.</p>
        </div>

        <div class="tal2">
            <div class="controls">
                <div class="ta1">
                    <input type="text" id="talkto" placeholder="Type a response or record audio...">
                </div>
                <div class="action-btns">
                    <button id="sendTextBtn" title="Send Text Message">
                        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>

                    <button id="startBtn" title="Start Recording">
                        <svg width="24" height="24" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C9.769 2 8 3.757 8 5.828v6.344C8 14.242 9.769 16 12 16s4-1.758 4-3.828V5.828C16 3.758 14.231 2 12 2Z"/><path d="M13 20.945V23a1 1 0 1 1-2 0v-2.055C6.5 20.448 3 16.633 3 12a1 1 0 1 1 2 0 7 7 0 1 0 14 0 1 1 0 1 1 2 0c0 4.633-3.5 8.448-8 8.945Z"/></svg>
                    </button>

                    <button id="pauseBtn" disabled title="Pause / Resume Recording" style="opacity: 0.4;">
                        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19,4V20a2,2,0,0,1-2,2H15a2,2,0,0,1-2-2V4a2,2,0,0,1,2-2h2A2,2,0,0,1,19,4ZM9,2H7A2,2,0,0,0,5,4V20a2,2,0,0,0,2,2H9a2,2,0,0,0,2-2V4A2,2,0,0,0,9,2Z"/></svg>
                    </button>

                    <button id="stopBtn" disabled title="Stop and Send Voice Note" style="opacity: 0.4;">
                        <svg width="22" height="22" viewBox="0 0 495.003 495.003">
                            <path d="M164.711,456.687c0,2.966,1.647,5.686,4.266,7.072c2.617,1.385,5.799,1.207,8.245-0.468l55.09-37.616l-67.6-32.22V456.687z"/>
                            <path d="M492.431,32.443c-1.513-1.395-3.466-2.125-5.44-2.125c-1.19,0-2.377,0.264-3.5,0.816L7.905,264.422c-4.861,2.389-7.937,7.353-7.904,12.783c0.033,5.423,3.161,10.353,8.057,12.689l125.342,59.724l250.62-205.99L164.455,364.414l156.145,74.4c1.918,0.919,4.012,1.376,6.084,1.376c1.768,0,3.519-0.322,5.186-0.977c3.637-1.438,6.527-4.318,7.97-7.956L494.436,41.257C494.436,38.188,494.862,34.679,492.431,32.443z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mic">
                <span id="status">Status: Idle</span>
            </div>
        </div>
    </div>
</div>

<script>
// --- IndexedDB Audio Storage Manager ---
const AudioStore = {
    dbName: 'VoiceChatDB',
    dbVersion: 1,
    storeName: 'audioTracks',
    db: null,
    async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.dbVersion);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(this.storeName)) {
                    db.createObjectStore(this.storeName);
                }
            };
            request.onsuccess = (e) => {
                this.db = e.target.result;
                resolve(this.db);
            };
            request.onerror = (e) => reject(e);
        });
    },
    async set(id, data) {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put(data, id);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e);
        });
    },
    async get(id) {
        await this.init();
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e);
        });
    }
};

let activeSelectedOrderId = null;
let mediaRecorder = null;
let audioChunks = [];
let audioCtx = null;
let audioStream = null;
let activeAudioPlayer = null;

const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const sendTextBtn = document.getElementById('sendTextBtn');
const textInput = document.getElementById('talkto');
const statusText = document.getElementById('status');
const chatArea = document.getElementById('chatArea');
const accountsListContainer = document.getElementById('accountsList');

const DEFAULT_ID = "default_guest_session";

const PLAY_SVG = `<svg viewBox="0 0 36 36" preserveAspectRatio="xMidYMid meet"><path d="M32.16,16.08,8.94,4.47A2.07,2.07,0,0,0,6,6.32V29.53a2.06,2.06,0,0,0,3,1.85L32.16,19.77a2.07,2.07,0,0,0,0-3.7Z"></path></svg>`;
const PAUSE_SVG = `<svg viewBox="0 0 24 24"><path d="M19,4V20a2,2,0,0,1-2,2H15a2,2,0,0,1-2-2V4a2,2,0,0,1,2-2h2A2,2,0,0,1,19,4ZM9,2H7A2,2,0,0,0,5,4V20a2,2,0,0,0,2,2H9a2,2,0,0,0,2-2V4A2,2,0,0,0,9,2Z"/></svg>`;
const VOL_HIGH_SVG = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
const VOL_MUTE_SVG = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

function getTargetId() {
    return activeSelectedOrderId || DEFAULT_ID;
}

function formatTime(seconds) {
    if (!seconds || isNaN(seconds) || !isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${mins}:${secs}`;
}

function getAccurateDuration(audioObj) {
    return new Promise((resolve) => {
        if (audioObj.duration && isFinite(audioObj.duration) && !isNaN(audioObj.duration)) {
            return resolve(audioObj.duration);
        }
        const durationHandler = () => {
            audioObj.removeEventListener('durationchange', durationHandler);
            audioObj.currentTime = 0;
            resolve(audioObj.duration);
        };
        audioObj.addEventListener('durationchange', durationHandler);
        audioObj.currentTime = 1e101;
    });
}

function stopAllAudioPlayback() {
    if (activeAudioPlayer) {
        activeAudioPlayer.pause();
        activeAudioPlayer.currentTime = 0;
        if (activeAudioPlayer._uiBtn) {
            activeAudioPlayer._uiBtn.innerHTML = PLAY_SVG;
            activeAudioPlayer._uiBtn.classList.remove('loading');
        }
        activeAudioPlayer = null;
    }
}

// Helper function to extract correct account/user name
function getAccountName(order, orderKey) {
    if (orderKey === DEFAULT_ID) return "Guest Chat";
    return order.accountName || order.userName || order.customerName || order.name || order.email || "Account (" + orderKey.substring(0, 6) + ")";
}

// 1. RECORDING LOGIC
startBtn.addEventListener('click', async () => {
    audioChunks = [];
    try {
        audioStream = await navigator.mediaDevices.getUserMedia({ 
            audio: { autoGainControl: true, echoCancellation: true, noiseSuppression: false } 
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(audioStream);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 2.0;
        
        const destination = audioCtx.createMediaStreamDestination();
        source.connect(gainNode);
        gainNode.connect(destination);

        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
        mediaRecorder = new MediaRecorder(destination.stream, { mimeType });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => saveAndSendVoiceNote(reader.result);

            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            if (audioCtx) audioCtx.close();

            startBtn.disabled = false;
            startBtn.style.opacity = "1";
            pauseBtn.disabled = true;
            pauseBtn.style.opacity = "0.4";
            stopBtn.disabled = true;
            stopBtn.style.opacity = "0.4";
            statusText.innerText = "Status: Idle / Sent";
        };

        mediaRecorder.start(100);
        startBtn.disabled = true;
        startBtn.style.opacity = "0.4";
        pauseBtn.disabled = false;
        pauseBtn.style.opacity = "1";
        stopBtn.disabled = false;
        stopBtn.style.opacity = "1";
        statusText.innerText = "Status: Recording...";

    } catch (err) {
        console.error("Microphone access error:", err);
        statusText.innerText = "Status: Error accessing microphone";
    }
});

pauseBtn.addEventListener('click', () => {
    if (!mediaRecorder) return;
    if (mediaRecorder.state === "recording") {
        mediaRecorder.pause();
        statusText.innerText = "Status: Recording Paused";
        pauseBtn.style.opacity = "0.5";
    } else if (mediaRecorder.state === "paused") {
        mediaRecorder.resume();
        statusText.innerText = "Status: Recording...";
        pauseBtn.style.opacity = "1";
    }
});

stopBtn.addEventListener('click', () => {
    if (mediaRecorder && (mediaRecorder.state === "recording" || mediaRecorder.state === "paused")) {
        mediaRecorder.stop();
    }
});

// 2. TEXT & VOICE MESSAGE PERSISTENCE
sendTextBtn.addEventListener('click', () => {
    const textNote = textInput.value.trim();
    if (!textNote) return;
    saveMessage({ sender: "owner", text: textNote, audioId: null });
    textInput.value = "";
});

textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendTextBtn.click();
});

async function saveAndSendVoiceNote(base64Audio) {
    const textNote = textInput.value.trim();
    const audioId = 'audio_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    try {
        await AudioStore.set(audioId, base64Audio);
        saveMessage({ sender: "owner", text: textNote || null, audioId: audioId });
    } catch (err) {
        console.error("Storage error, falling back to JSON:", err);
        saveMessage({ sender: "owner", text: textNote || null, audio: base64Audio });
    }
    textInput.value = "";
}

function saveMessage(msgObj) {
    const targetId = getTargetId();
    let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || {};

    if (!allOrders[targetId]) {
        allOrders[targetId] = {
            name: targetId === DEFAULT_ID ? "Guest Chat" : "Account",
            talk: true,
            voiceChats: []
        };
    }
    if (!allOrders[targetId].voiceChats) {
        allOrders[targetId].voiceChats = [];
    }

    const msgData = {
        ...msgObj,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    allOrders[targetId].voiceChats.push(msgData);
    localStorage.setItem('admin_orders', JSON.stringify(allOrders));

    if (!activeSelectedOrderId) activeSelectedOrderId = targetId;

    renderAccounts();
    
    const emptyMsg = chatArea.querySelector('.empty-chat-msg');
    if (emptyMsg) emptyMsg.remove();
    
    appendMessageBubble(msgData);
}

// 3. UI BUBBLE RENDERER & AUDIO CONTROLLER
async function appendMessageBubble(msg) {
    if (!chatArea) return;

    const time = msg.timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const bubble = document.createElement('div');
    bubble.className = `message ${msg.sender === 'owner' ? 'sent' : 'received'}`;

    let innerContent = "";
    if (msg.text) {
        innerContent += `<div class="message-text">${msg.text}</div>`;
    }

    if (msg.audioId || msg.audio) {
        innerContent += `
            <div class="voice-note-card">
                <div class="vn-top-row">
                    <button class="vn-play-btn">${PLAY_SVG}</button>
                    <div class="vn-waveform">
                        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                            <rect x="2" y="10" width="3" height="10" rx="1.5"/><rect x="8" y="5" width="3" height="20" rx="1.5"/>
                            <rect x="14" y="12" width="3" height="6" rx="1.5"/><rect x="20" y="3" width="3" height="24" rx="1.5"/>
                            <rect x="26" y="8" width="3" height="14" rx="1.5"/><rect x="32" y="2" width="3" height="26" rx="1.5"/>
                            <rect x="38" y="6" width="3" height="18" rx="1.5"/><rect x="44" y="1" width="3" height="28" rx="1.5"/>
                            <rect x="50" y="4" width="3" height="22" rx="1.5"/><rect x="56" y="7" width="3" height="16" rx="1.5"/>
                            <rect x="62" y="2" width="3" height="26" rx="1.5"/><rect x="68" y="10" width="3" height="10" rx="1.5"/>
                            <rect x="74" y="5" width="3" height="20" rx="1.5"/><rect x="80" y="12" width="3" height="6" rx="1.5"/>
                            <rect x="86" y="8" width="3" height="14" rx="1.5"/>
                        </svg>
                    </div>
                    <span class="vn-duration">0:00 / 0:00</span>
                </div>
                <div class="vn-controls-row">
                    <div class="vn-slider-container">
                        <input type="range" class="vn-progress-slider" value="0" min="0" max="100" step="0.1">
                    </div>
                    <div class="vn-volume-container">
                        <button class="vn-volume-btn">${VOL_HIGH_SVG}</button>
                        <input type="range" class="vn-volume-slider" value="1" min="0" max="1" step="0.05">
                    </div>
                </div>
            </div>
        `;
    }

    innerContent += `<span class="time-stamp">${time}</span>`;
    bubble.innerHTML = innerContent;
    chatArea.appendChild(bubble);

    if (msg.audioId || msg.audio) {
        const card = bubble.querySelector('.voice-note-card');
        const playBtn = card.querySelector('.vn-play-btn');
        const slider = card.querySelector('.vn-progress-slider');
        const durationSpan = card.querySelector('.vn-duration');
        const volBtn = card.querySelector('.vn-volume-btn');
        const volSlider = card.querySelector('.vn-volume-slider');

        let audioSrc = msg.audio;
        if (msg.audioId) {
            audioSrc = await AudioStore.get(msg.audioId);
        }

        if (!audioSrc) {
            durationSpan.textContent = "Error loading audio";
            return;
        }

        const audio = new Audio(audioSrc);
        audio.preload = "metadata";
        audio._uiBtn = playBtn;

        let isUserSeeking = false;
        let realDuration = 0;

        getAccurateDuration(audio).then(dur => {
            realDuration = dur;
            durationSpan.textContent = `0:00 / ${formatTime(realDuration)}`;
        });

        audio.addEventListener('timeupdate', () => {
            if (!isUserSeeking && realDuration) {
                const pct = (audio.currentTime / realDuration) * 100;
                slider.value = pct;
                slider.style.background = `linear-gradient(to right, #00a884 ${pct}%, #ccc ${pct}%)`;
                durationSpan.textContent = `${formatTime(audio.currentTime)} / ${formatTime(realDuration)}`;
            }
        });

        audio.addEventListener('ended', () => {
            playBtn.innerHTML = PLAY_SVG;
            slider.value = 0;
            slider.style.background = '#ccc';
            audio.currentTime = 0;
            durationSpan.textContent = `0:00 / ${formatTime(realDuration)}`;
            if (activeAudioPlayer === audio) activeAudioPlayer = null;
        });

        const startSeek = () => { isUserSeeking = true; };
        const endSeek = () => {
            if (isUserSeeking && realDuration) {
                audio.currentTime = (slider.value / 100) * realDuration;
                isUserSeeking = false;
            }
        };

        slider.addEventListener('pointerdown', startSeek);
        slider.addEventListener('pointerup', endSeek);
        slider.addEventListener('pointercancel', endSeek);
        slider.addEventListener('input', () => {
            slider.style.background = `linear-gradient(to right, #00a884 ${slider.value}%, #ccc ${slider.value}%)`;
            if (realDuration) {
                const seekTime = (slider.value / 100) * realDuration;
                durationSpan.textContent = `${formatTime(seekTime)} / ${formatTime(realDuration)}`;
            }
        });

        playBtn.addEventListener('click', async () => {
            if (!audio.paused) {
                audio.pause();
                playBtn.innerHTML = PLAY_SVG;
                return;
            }

            stopAllAudioPlayback();

            playBtn.classList.add('loading');
            playBtn.innerHTML = PLAY_SVG;

            try {
                if (!realDuration || !isFinite(realDuration)) {
                    realDuration = await getAccurateDuration(audio);
                }
                audio.volume = parseFloat(volSlider.value);
                await audio.play();
                playBtn.classList.remove('loading');
                playBtn.innerHTML = PAUSE_SVG;
                activeAudioPlayer = audio;
            } catch (err) {
                console.error("Playback prevented:", err);
                playBtn.classList.remove('loading');
                playBtn.innerHTML = PLAY_SVG;
            }
        });

        volSlider.addEventListener('input', () => {
            const val = parseFloat(volSlider.value);
            audio.volume = val;
            volBtn.innerHTML = (val === 0) ? VOL_MUTE_SVG : VOL_HIGH_SVG;
        });

        volBtn.addEventListener('click', () => {
            if (parseFloat(volSlider.value) > 0) {
                volBtn._lastVol = volSlider.value;
                volSlider.value = 0;
            } else {
                volSlider.value = volBtn._lastVol || 1;
            }
            audio.volume = parseFloat(volSlider.value);
            volBtn.innerHTML = (parseFloat(volSlider.value) === 0) ? VOL_MUTE_SVG : VOL_HIGH_SVG;
        });
    }

    chatArea.scrollTop = chatArea.scrollHeight;
}

// 4. ACCOUNT & CHAT MANAGEMENT
function createAvatarSVG(name) {
    let firstLetter = (name || "U").charAt(0).toUpperCase();
    let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#3b50fb"/><text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="45" font-family="Arial, sans-serif" font-weight="bold">${firstLetter}</text></svg>`;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svgString)}`;
}

function renderAccounts() {
    let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || {};
    accountsListContainer.innerHTML = "";
    
    // Filter only orders where `#talk` checkbox is enabled/checked
    let activeTalkOrderKeys = Object.keys(allOrders).filter(orderKey => {
        const order = allOrders[orderKey];
        // Checks order property OR live DOM checkbox `#talk` status
        const domTalkCheckbox = document.querySelector(`.admi3[data-order-id="${orderKey}"] #talk, #order-${orderKey} #talk`);
        const isDomChecked = domTalkCheckbox ? domTalkCheckbox.checked : false;
        return order.talkToOwnerRequested === true || order.talkToOwnerRequested === "true" || isDomChecked;
    });

    if (activeTalkOrderKeys.length === 0) {
        accountsListContainer.innerHTML = `<p style="padding: 15px; color: #888; font-style: italic;">No active orders with Talk enabled.</p>`;
        return;
    }

    // Ensure selected active ID is still within valid filtered orders
    if (activeTalkOrderKeys.length > 0 && !activeTalkOrderKeys.includes(activeSelectedOrderId)) {
        activeSelectedOrderId = activeTalkOrderKeys[0];
    }

    activeTalkOrderKeys.forEach(orderKey => {
        let order = allOrders[orderKey];
        
        // Dynamically get the proper Account Name instead of generic Customer
        let name = getAccountName(order, orderKey);
        let avatar = order.avatar || createAvatarSVG(order.customer.name);

        let div = document.createElement('div');
        div.className = `account-item ${orderKey === activeSelectedOrderId ? 'active' : ''}`;
        div.onclick = () => selectAccount(orderKey);

        div.innerHTML = `
            <img src="${avatar}" alt="profile">
            <div class="account-info">
                <h4>${order.customer.name}</h4>
                <p>ID: ${orderKey.substring(0, 18)}...</p>
            </div>
        `;
        accountsListContainer.appendChild(div);
    });
}

function selectAccount(orderKey) {
    if (activeSelectedOrderId === orderKey) return;
    stopAllAudioPlayback();
    activeSelectedOrderId = orderKey;
    renderAccounts();
    renderChat();
}

async function renderChat() {
    stopAllAudioPlayback();
    chatArea.innerHTML = "";
    const targetId = getTargetId();
    let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || {};
    let orderRecord = allOrders[targetId];

    if (orderRecord && orderRecord.voiceChats && orderRecord.voiceChats.length > 0) {
        for (const msg of orderRecord.voiceChats) {
            await appendMessageBubble(msg);
        }
    } else {
        chatArea.innerHTML = `<p class="empty-chat-msg" style="text-align: center; color: #888; margin-top: 50px;">No messages in this chat yet. Send a text or record audio below.</p>`;
    }
}

// Real-Time Sync across local storage and DOM checkbox changes
window.addEventListener('storage', (e) => {
    if (e.key === 'admin_orders') {
        renderAccounts();
        renderChat();
    }
});

document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'talk') {
        const parentOrderEl = e.target.closest('[data-order-id]');
        const orderId = parentOrderEl ? parentOrderEl.dataset.orderId : activeSelectedOrderId;

        if (orderId) {
            let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || {};
            if (allOrders[orderId]) {
                allOrders[orderId].talk = e.target.checked;
                localStorage.setItem('admin_orders', JSON.stringify(allOrders));
            }
        }
        renderAccounts();
    }
});

// Initialize Application
renderAccounts();
renderChat();
</script>
