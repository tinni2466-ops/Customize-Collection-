body{
    font-family: 'Poppins', sans-serif;
    margin: 0;
}
.brand{
    display: flex;
    gap: 10px;
    align-items: center;
}
.br-name1{
    font-size: 40px;
    font-weight: bold;
    padding: 10px 0;
}
.br-name2 {
    font-size: 40px;
    font-weight: bold;
    background-image: url('https://res.cloudinary.com/dnami0fsz/image/upload/q_auto:low,f_avif,w_500/v1781711611/Ruffle-Sleeve-Dress_d5npo1.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 10px;
    color: #fff;
    border-radius: 10px;
    -webkit-text-stroke: 2px #d5d5d5;
}
.container{
    width: 1300px;
    max-width: 90vw;
    margin: auto;
    text-align: center;
    padding-top: 10px;
    transition: transform .5s;
}
header{
    display: flex;
    align-items: center;
    justify-content: space-between ;
    padding: 20px;
}
.right-header{
    align-items: center;
    display: flex;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-right: 20px;
}
.home{
    padding: 5px 0 0 40px;
}
.right-header button:hover{ background: #7c0000; }
.right-header button{
    padding: 8px 8px;
    border-radius: 25px;
    font-weight: bold;
    border: none;
    color: #fff;
    cursor: pointer;
    background-color: rgb(183, 7, 7);
    box-shadow: 0 4px 6px rgb(255 0 0 / 20%);
}
.item{
    border-radius: 20px;
    background-color: #f9f9f9;
    border: 2px solid #d6d6d677;
    display: flex;
    align-items: center;
    grid-template-columns: repeat(2, 1fr);
    justify-content: space-between ;
    margin: 0 10px;
}
.item img{
    width: 160px;
}
.rightit button:hover{ background: #7c0000; }
.rightit button{
    padding: 4px 8px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background-color: rgb(183, 7, 7);
    box-shadow: 0 4px 6px rgb(255 0 0 / 20%);
    margin-right: 40px;
}
.leftit{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-left: 40px;
}
.leftit .color{
    background-color: blue;
    width: 40px;
    height: 16px;
    border: 1px solid #000000;
}
.tota{
    display: flex;
    align-items: center;
    grid-template-columns: repeat(2, 1fr);
    justify-content: space-between ;
}
.tota1{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    align-items: center;
    gap: 10px;
    margin-left: 40px;
}
.tota0{
    width: 94px;
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    align-items: center;
}
.tota2{
    display: grid;
    align-items: center;
}
.tota3{
    display: grid;
    align-items: center;
}
.price{
    margin-right: 40px;
}
.price1{
    margin-left: 4px;
}
.Overview{
    border-radius: 20px;
    border: 2px solid #d6d6d677;
    padding: 6px;
    margin: 40px 80px;
}
.over{
    gap: 10px;
    margin-left: 10px;
    display: flex;
    align-items: center;
}
.over h2{
    font-size: large;
}
.over svg{
    fill: #b70707;
    width: 20px;
    height: 20px;
}
.loca{
    border-radius: 20px;
    border: 2px solid #d6d6d677;
    padding: 6px;
    margin: 40px 80px;
}
.loca1{
    gap: 6px;
    margin-left: 10px;
    display: flex;
    align-items: center;
}
.loca1 h2{
    font-size: large;
}
.loca2{
    border-radius: 20px;
    background-color: #f9f9f9;
    border: 2px solid #d6d6d677;
    align-items: center;
    margin: 0 10px 10px 10px;
}
.loca3{
    padding: 20px;
    text-align: center;
}
.loca4{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    margin-top: 20px;
    align-items: center;
}
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
.loca input, select { 
    width: 100%; 
    padding: 8px; 
    max-width: 400px; 
    box-sizing: border-box; 
    border: none; 
    box-shadow: 0 4px 6px rgba(0, 0, 32, 0.1);
    border-radius: 6px; 
}
.geo-btn {
    box-shadow: 0 4px 6px rgba(0, 0, 255, 0.3);
    background: #007BFF;
    color: white;
    display: flex;
    align-items: center;
    border: none; 
    padding: 10px 15px; 
    cursor: pointer; 
    border-radius: 30px; 
    margin: 15px 24%;
    gap: 6px;
}
.geo-btn svg{
    display: flex;
    align-items: center;
}
.geo-btn:hover { background: #0056b3; }
.row { display: flex; gap: 10px; margin-bottom: 30px; }
.row .form-group { flex: 1; }
.sub button:hover{ background: #7c0000; }
.sub button{
    border-radius: 30px;
    font-weight: bold;
    border: none;
    color: #fff;
    cursor: pointer;
    background-color: rgb(183, 7, 7);
    box-shadow: 0 4px 6px rgb(255 0 0 / 20%);
}
.orcud{
    border-radius: 20px;
    border: 2px solid #d6d6d677;
    padding: 6px;
    margin: 40px 80px;
}
.orcud1{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
}
.orcud1 h2{
    font-size: large;
}
.orcud3{
    border-radius: 20px 20px 0 0;
    border: 2px solid #d6d6d677;
    padding: 0 20px;
    margin: 0 10px 0 10px;
    background-color: #f9f9f9;
    height: 500px;
}
.orcud4{
    border: 2px solid #d6d6d677;
    border-radius: 0 0 20px 20px;
    padding: 6px;
    margin: -2px 10px 10px 10px;
    display: flex;
    gap: 10px;
}
.orcud5 input{
    width: 100%; 
    padding: 8px;
    min-width: 1150px;
    box-sizing: border-box; 
    border: none;
    border-radius: 6px;
}
.orcud6 svg{
    width: 20px;
    height: 22px;
}
.orcud6 button:hover{ background: #7c0000; }
.orcud6 button{
    fill: #fff;
    padding: 6px 8px 8px 6px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background-color: rgb(183, 7, 7);
    box-shadow: 0 4px 6px rgb(255 0 0 / 20%);
    width: 34px;
    height: 34px;
}
.conord{
    width: 100%;
    display: block;
    text-align: center;
    max-width: 1400px;
}
.conord button{
    box-shadow: 0 4px 6px rgba(255, 0, 0, 0.3);
    background: #b70707;
    color: white;
    border: none;
    padding: 10px 30px;
    cursor: pointer;
    border-radius: 60px;
    margin: 15px;
}
.conord button:hover{ background: #7c0000; }
.tatoo{
    border-radius: 20px;
    background-color: #f9f9f9;
    box-shadow: 0 4px 6px rgba(0, 0, 32, 0.1);
    padding: 6px;
    margin: 40px 80px;
}
.tatoo1{
    padding: 6px;
    margin: 10px;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 32, 0.1);
    display: flex;
    max-width: 400px;
    background-color: #fff;
    grid-template-columns: repeat(2 ,1fr);
    gap: 30px;
}
.tatoo2{
    display: flex;
    grid-template-columns: repeat(2 ,1fr);
    gap: 10px;
}
.tato{
    margin: 0;
}
.ite1{
    display: grid;
    gap: 4px;

@media screen and (max-width: 600px){
    .br-name1, .br-name2{
        font-size: 28px;
    }
    header{
        display: flow;
    }
    .right-header{
        margin-top: 10px;
        margin-left: 44%;
        margin-right: 0;
    }
    .Overview{
        margin: 10px 3%;
    }
    .leftit{
        margin-left: 0;
    }
    .rightit button{
        margin-right: 0;
    }
    .loca{
        margin: 10px 3%;
    }
    .geo-btn{
        margin: 10px 4%;
    }
    .loca3{
        padding: 10px;
    }
    .orcud{
        margin: 10px 3%;
    }
    .orcud4{
        align-items: center;
    }
    .orcud5 input {
        min-width: 250px;
    }
    .tatoo{
        margin: 10px 3%;
    }
}
</style>
